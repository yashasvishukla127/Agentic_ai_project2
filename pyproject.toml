[project]
name = "rag-eval-system"
version = "0.1.0"
description = "RAG system with evaluation capabilities"
requires-python = ">=3.9"
dependencies = [
    "psycopg[binary,pool]>=3.1.0",
    "pgvector>=0.2.0",
    "openai>=1.0.0",
    "cohere>=5.0.0",
    "ragas>=0.1.0",
    "tenacity>=8.2.0",
    "pybreaker>=1.0.0",
    "langfuse>=2.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
